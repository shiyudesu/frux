[project]
name = "frux-semantic-embedding"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "fastapi==0.116.1",
  "numpy==2.3.2",
  "pydantic==2.11.7",
  "sentence-transformers==5.0.0",
  "torch==2.7.1",
  "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frux_embedding"]
