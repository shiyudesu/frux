# Personal/pre-production prod configuration.
port: 8080
jwt:
  issuer: "frux"
  access_ttl: "5m"
  admin_access_ttl: "30m"
  clock_leeway: "30s"
  consumer:
    active_key_id: "consumer-v1"
    keys:
      - id: "consumer-v1"
        secret: "${FRUX_JWT_CONSUMER_SECRET}"
  admin:
    active_key_id: "admin-v1"
    keys:
      - id: "admin-v1"
        secret: "${FRUX_JWT_ADMIN_SECRET}"
  legacy_secret: "${FRUX_JWT_LEGACY_SECRET}"
  legacy_issued_until: "${FRUX_JWT_LEGACY_ISSUED_UNTIL}"
  legacy_accept_until: "${FRUX_JWT_LEGACY_ACCEPT_UNTIL}"

security:
  hmac_secret: "${FRUX_HMAC_SECRET}"

internal:
  enabled: true
  token: "${FRUX_INTERNAL_TOKEN}"

database:
  host: "postgres"
  port: 5432
  user: "${FRUX_POSTGRES_USER}"
  password: "${FRUX_POSTGRES_PASSWORD}"
  name: "${FRUX_POSTGRES_DATABASE}"
  ssl_mode: "disable"
  time_zone: "UTC"

redis:
  addr: "redis:6379"
  password: "${FRUX_REDIS_PASSWORD}"
  db: 0

kafka:
  enabled: true
  environment: "local"
  brokers:
    - "kafka:9092"
  client_id: "frux-prod"
  topic_prefix: ""
  allow_local_provisioning: true
  authentication:
    mechanism: "none"
    username: ""
    password: ""
  tls:
    enabled: false
    ca_file: ""
    certificate_file: ""
    private_key_file: ""
    server_name: ""
    insecure_skip_verify: false
  timeouts:
    dial: "5s"
    request: "10s"
    produce: "10s"
    admin: "10s"
    shutdown: "15s"
  consumer:
    max_poll_records: 100
    max_poll_bytes: 8388608
    partition_concurrency: 8
    drain_timeout: "10s"
    assignment_timeout: "15s"
  production_validation:
    replication_factor: 1
    min_in_sync_replicas: 1
    require_authentication: false
    require_tls: false

media:
  backend: "s3"
  local_root: "./uploads"
  public_base_url: "https://${FRUX_DOMAIN}:${FRUX_PUBLIC_HTTPS_PORT}/media"
  signed_url_ttl: "15m"
  upload_session_ttl: "15m"
  processing:
    profile_version: "v2"
    max_attempts: 5
    worker_concurrency: 1
    lease_ttl: "10m"
    max_duration: "180m"
    command_timeout: "360m"
    ffmpeg_preset: "veryfast"
    cleanup_delay: "24h"
    disable_orphan_cleanup: true
  s3:
    endpoint: "http://minio:9000"
    presign_endpoint: "https://${FRUX_S3_DOMAIN}:${FRUX_PUBLIC_HTTPS_PORT}"
    region: "us-east-1"
    bucket: "${FRUX_S3_BUCKET}"
    access_key: "${FRUX_S3_ACCESS_KEY}"
    secret_key: "${FRUX_S3_SECRET_KEY}"
    use_path_style: true
    auto_create_bucket: false
    require_public_https: true

moderation:
  mode: "disabled"

multimodal:
  enabled: false
  video_jobs_enabled: false
  query_embedding_enabled: false
  hybrid_search_enabled: false
  similar_videos_enabled: false
  max_video_text_runes: 2048
  contract:
    provider_alias: "alibaba-bailian"
    model_alias: "tongyi-embedding-vision-flash"
    revision_alias: "2026-03-06-res1"
    dimension: 768
    text_canonicalizer: "public-content-v1"
    frame_sampling_policy: "representative-frames-v1"
    image_preprocessing_policy: "rgb-fit-v1"
    fusion_policy: "provider-fusion-v1"
  provider:
    endpoint: "${FRUX_MULTIMODAL_ENDPOINT}"
    hmac_secret: "${FRUX_MULTIMODAL_HMAC_SECRET}"
    protocol_version: "frux-multimodal-v1"
    allow_insecure_local: false
    startup_timeout: "3s"
    deadline: "15s"
    admission_limit: 2
    max_request_bytes: 25165824
    max_response_bytes: 2097152

playback:
  telemetry:
    retention: "168h"
    cleanup_interval: "1h"
    cleanup_batch_size: 1000
    max_batches_per_minute: 60

governance:
  poll_interval: "5s"
  poll_timeout: "2s"

rate_limit:
  max_entries: 10000
  idle_ttl: "10m"
  redis_timeout: "75ms"
  trusted_proxies:
    - "172.31.254.0/24"
