port: 8080
jwt:
  secret: "replace-with-strong-secret"
  access_ttl: "15m"

internal:
  token: "replace-with-internal-token"

database:
  host: "postgres"
  port: 5432
  user: "gcfeed"
  password: "sealos123"
  name: "gcfeed"
  ssl_mode: "disable"
  time_zone: "UTC"

redis:
  addr: "redis:6379"
  password: ""
  db: 0

rabbitmq:
  url: "amqp://guest:guest@rabbitmq:5672/"
  interaction_exchange: "gcfeed.interaction"
  action_changed_queue: "gcfeed.interaction.action_changed"
  action_changed_routing: "interaction.action_changed"
  video_exchange: "gcfeed.video"
  video_published_queue: "gcfeed.video.published"
  video_embedding_queue: "gcfeed.video.embedding"
  video_published_routing: "video.published"
  exposure_exchange: "gcfeed.exposure"
  view_event_recorded_queue: "gcfeed.exposure.view_event_recorded"
  view_event_recorded_routing: "exposure.view_event_recorded"
  media_exchange: "gcfeed.media"
  media_processing_queue: "gcfeed.media.processing"
  media_processing_routing: "media.processing.requested"

media:
  backend: "s3"
  local_root: "./uploads"
  public_base_url: "http://127.0.0.1:9000/gcfeed-media"
  signed_url_ttl: "15m"
  upload_session_ttl: "15m"
  processing:
    profile_version: "v1"
    max_attempts: 5
    worker_concurrency: 1
    lease_ttl: "10m"
    cleanup_delay: "24h"
  s3:
    endpoint: "http://minio:9000"
    presign_endpoint: "http://127.0.0.1:9000"
    region: "us-east-1"
    bucket: "gcfeed-media"
    access_key: "gcfeed"
    secret_key: "gcfeed-secret"
    use_path_style: true
    auto_create_bucket: true
