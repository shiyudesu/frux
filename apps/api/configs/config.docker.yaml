port: 8080
jwt:
  secret: "replace-with-strong-secret"
  access_ttl: "15m"
  admin_access_ttl: "30m"

internal:
  enabled: true
  token: "${FRUX_INTERNAL_TOKEN}"

database:
  host: "postgres"
  port: 5432
  user: "frux"
  password: "sealos123"
  name: "frux"
  ssl_mode: "disable"
  time_zone: "UTC"

redis:
  addr: "redis:6379"
  password: ""
  db: 0

rabbitmq:
  url: "amqp://guest:guest@rabbitmq:5672/"
  management_url: "http://rabbitmq:15672"
  management_username: "guest"
  management_password: "guest"
  management_timeout: "2s"
  interaction_exchange: "frux.interaction"
  action_changed_queue: "frux.interaction.action_changed"
  action_changed_routing: "interaction.action_changed"
  video_exchange: "frux.video"
  video_published_queue: "frux.video.published"
  video_embedding_queue: "frux.video.embedding"
  video_published_routing: "video.published"
  exposure_exchange: "frux.exposure"
  view_event_recorded_queue: "frux.exposure.view_event_recorded"
  view_event_recorded_routing: "exposure.view_event_recorded"
  media_exchange: "frux.media"
  media_processing_queue: "frux.media.processing"
  media_processing_routing: "media.processing.requested"
  dead_letter:
    enabled: true
    version_suffix: ".q2"
    exchange_suffix: ".dlx.q2"
    queue_suffix: ".dlq.q2"
    delivery_limit: 5
    source_max_length: 100000
    dead_letter_max_length: 10000
    preview_limit: 20
    replay_timeout: "5s"
    action_changed_mode: "dual"
    video_published_mode: "legacy"
    video_embedding_mode: "legacy"
    view_event_recorded_mode: "legacy"
    media_processing_mode: "legacy"

media:
  backend: "s3"
  local_root: "./uploads"
  public_base_url: "http://127.0.0.1:9000/frux-media"
  signed_url_ttl: "15m"
  upload_session_ttl: "15m"
  processing:
    profile_version: "v1"
    max_attempts: 5
    worker_concurrency: 1
    lease_ttl: "10m"
    cleanup_delay: "24h"
  s3:
    endpoint: "http://minio:9000"
    presign_endpoint: "http://127.0.0.1:9000"
    region: "us-east-1"
    bucket: "frux-media"
    access_key: "frux"
    secret_key: "frux-secret"
    use_path_style: true
    auto_create_bucket: true

moderation:
  mode: "${FRUX_MODERATION_MODE}"
  provider_config_version: 1
  input_profile_version: "frames-v1"
  endpoint: "${FRUX_MODERATION_ENDPOINT}"
  hmac_secret: "${FRUX_MODERATION_HMAC_SECRET}"
  allow_insecure_local: false
  timeout: "10s"
  worker_concurrency: 2
  max_attempts: 5
  lease_ttl: "45s"
  poll_interval: "1s"
  sample_url_ttl: "30s"
  sample_retention: "1h"
  sample_presign_endpoint: "${FRUX_MODERATION_SAMPLE_PRESIGN_ENDPOINT}"

playback:
  telemetry:
    retention: "168h"
    cleanup_interval: "1h"
    cleanup_batch_size: 1000
    max_batches_per_minute: 60

governance:
  poll_interval: "5s"
  poll_timeout: "2s"

rate_limit:
  max_entries: 10000
  idle_ttl: "10m"
  redis_timeout: "75ms"
  trusted_proxies:
    - "172.31.250.10/32"
