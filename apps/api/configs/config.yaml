# Local development configuration. Replace all credentials before using it on
# a shared or remote environment.
port: 8080
jwt:
  issuer: "frux"
  access_ttl: "5m"
  admin_access_ttl: "30m"
  clock_leeway: "30s"
  consumer:
    active_key_id: "consumer-v1"
    keys:
      - id: "consumer-v1"
        secret: "local-consumer-jwt-secret-replace-me"
  admin:
    active_key_id: "admin-v1"
    keys:
      - id: "admin-v1"
        secret: "local-admin-jwt-secret-replace-me-now"

security:
  hmac_secret: "local-application-hmac-secret-replace-me"

internal:
  enabled: true
  token: "${FRUX_INTERNAL_TOKEN}"

database:
  host: "localhost"
  port: 5432
  user: "frux"
  password: "password"
  name: "frux"
  ssl_mode: "disable"
  time_zone: "UTC"

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

kafka:
  enabled: true
  environment: "local"
  brokers:
    - "localhost:29092"
  client_id: "frux-local"
  topic_prefix: ""
  allow_local_provisioning: true
  authentication:
    mechanism: "none"
    username: ""
    password: ""
  tls:
    enabled: false
    ca_file: ""
    certificate_file: ""
    private_key_file: ""
    server_name: ""
    insecure_skip_verify: false
  timeouts:
    dial: "5s"
    request: "10s"
    produce: "10s"
    admin: "10s"
    shutdown: "15s"
  consumer:
    max_poll_records: 100
    max_poll_bytes: 8388608
    partition_concurrency: 8
    drain_timeout: "10s"
    assignment_timeout: "15s"
  production_validation:
    replication_factor: 1
    min_in_sync_replicas: 1
    require_authentication: false
    require_tls: false

media:
  backend: "local"
  local_root: "./uploads"
  public_base_url: "/media"
  signed_url_ttl: "15m"
  upload_session_ttl: "15m"
  processing:
    profile_version: "v2"
    max_attempts: 5
    worker_concurrency: 1
    lease_ttl: "10m"
    max_duration: "180m"
    command_timeout: "360m"
    ffmpeg_preset: "veryfast"
    cleanup_delay: "24h"
  s3:
    endpoint: ""
    presign_endpoint: ""
    region: "us-east-1"
    bucket: ""
    access_key: ""
    secret_key: ""
    use_path_style: true
    auto_create_bucket: false

moderation:
  mode: "${FRUX_MODERATION_MODE}"
  provider_config_version: 1
  input_profile_version: "frames-v1"
  endpoint: "${FRUX_MODERATION_ENDPOINT}"
  hmac_secret: "${FRUX_MODERATION_HMAC_SECRET}"
  allow_insecure_local: true
  timeout: "10s"
  worker_concurrency: 2
  max_attempts: 5
  lease_ttl: "45s"
  poll_interval: "1s"
  sample_url_ttl: "30s"
  sample_retention: "1h"
  sample_presign_endpoint: "${FRUX_MODERATION_SAMPLE_PRESIGN_ENDPOINT}"

multimodal:
  enabled: false

playback:
  telemetry:
    retention: "168h"
    cleanup_interval: "1h"
    cleanup_batch_size: 1000
    max_batches_per_minute: 60

governance:
  poll_interval: "5s"
  poll_timeout: "2s"

rate_limit:
  max_entries: 10000
  idle_ttl: "10m"
  redis_timeout: "75ms"
  trusted_proxies:
    - "127.0.0.1/32"
    - "::1/128"
