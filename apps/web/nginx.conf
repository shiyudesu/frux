map $http_x_forwarded_host $frux_forwarded_host {
  default $http_x_forwarded_host;
  "" $http_host;
}

map $http_x_forwarded_proto $frux_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 1024m;

  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8080;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $frux_forwarded_host;
    proxy_set_header X-Forwarded-Host $frux_forwarded_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $frux_forwarded_proto;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /uploads/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $frux_forwarded_host;
    proxy_set_header X-Forwarded-Host $frux_forwarded_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $frux_forwarded_proto;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
