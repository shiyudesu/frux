groups:
  - name: frux-rabbitmq-dead-letter
    rules:
      - alert: FruxRabbitMQDeadLetterBacklog
        expr: frux_mq_dead_letter_depth > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Frux dead-letter backlog is not draining"
          description: "Consumer {{ $labels.consumer }} has retained dead-letter messages for at least ten minutes."

      - alert: FruxRabbitMQDeadLetterBacklogHigh
        expr: frux_mq_dead_letter_depth >= 100
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Frux dead-letter backlog is high"
          description: "Consumer {{ $labels.consumer }} has at least 100 dead-letter messages."

      - alert: FruxRabbitMQRetryExhaustion
        expr: increase(frux_mq_retry_exhausted_total[10m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Frux RabbitMQ messages exhausted retries"
          description: "Consumer {{ $labels.consumer }} exhausted its bounded delivery policy."

      - alert: FruxRabbitMQRecoveryFailure
        expr: increase(frux_mq_replay_total{result=~"publish_failure|timeout|audit_failure|ack_failure"}[10m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Frux dead-letter replay failed"
          description: "At least one operator replay failed confirmation, audit, or acknowledgement."

      - alert: FruxRabbitMQRoutingFailure
        expr: increase(frux_mq_routing_failures_total[10m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Frux RabbitMQ dead-letter or replay routing failed"
          description: "Consumer {{ $labels.consumer }} recorded a routing or management failure."
