global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: frux-benchmark-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8080

  - job_name: frux-benchmark-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - worker:9091
