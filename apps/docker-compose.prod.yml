# Personal/pre-production prod stack. Not highly available.
services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_USER: ${FRUX_POSTGRES_USER:-frux}
      POSTGRES_PASSWORD: ${FRUX_POSTGRES_PASSWORD:?set FRUX_POSTGRES_PASSWORD}
      POSTGRES_DB: ${FRUX_POSTGRES_DATABASE:-frux}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${FRUX_REDIS_PASSWORD:?set FRUX_REDIS_PASSWORD}
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

  kafka:
    image: apache/kafka:4.0.0
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_MESSAGE_TIMESTAMP_TYPE: "LogAppendTime"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks:
      - backend

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${FRUX_MINIO_ROOT_USER:?set FRUX_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${FRUX_MINIO_ROOT_PASSWORD:?set FRUX_MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: https://${FRUX_DOMAIN:?set FRUX_DOMAIN}:${FRUX_PUBLIC_HTTPS_PORT:?set FRUX_PUBLIC_HTTPS_PORT}
    ports:
      - "127.0.0.1:${FRUX_MINIO_API_PORT:-19000}:9000"
      - "127.0.0.1:${FRUX_MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    environment:
      MINIO_ROOT_USER: ${FRUX_MINIO_ROOT_USER:?set FRUX_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${FRUX_MINIO_ROOT_PASSWORD:?set FRUX_MINIO_ROOT_PASSWORD}
      FRUX_S3_ACCESS_KEY: ${FRUX_S3_ACCESS_KEY:?set FRUX_S3_ACCESS_KEY}
      FRUX_S3_SECRET_KEY: ${FRUX_S3_SECRET_KEY:?set FRUX_S3_SECRET_KEY}
      FRUX_S3_BUCKET: ${FRUX_S3_BUCKET:?set FRUX_S3_BUCKET}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if test "$${MINIO_ROOT_USER}" = "$${FRUX_S3_ACCESS_KEY}"; then
          echo "MinIO root user and Frux application access key must differ" >&2
          exit 1
        fi
        if test "$${MINIO_ROOT_PASSWORD}" = "$${FRUX_S3_SECRET_KEY}"; then
          echo "MinIO root password and Frux application secret key must differ" >&2
          exit 1
        fi
        bucket="$${FRUX_S3_BUCKET}"
        if test "$${#bucket}" -lt 3 || test "$${#bucket}" -gt 63; then
          echo "FRUX_S3_BUCKET must contain between 3 and 63 characters" >&2
          exit 1
        fi
        case "$${bucket}" in
          *[!a-z0-9.-]*|.*|*.|-*|*-|*..*)
            echo "FRUX_S3_BUCKET must be a valid lowercase S3 bucket name" >&2
            exit 1
            ;;
        esac
        app_user="$${FRUX_S3_ACCESS_KEY}"
        if test "$${#app_user}" -lt 3 || test "$${#app_user}" -gt 64; then
          echo "FRUX_S3_ACCESS_KEY must contain between 3 and 64 characters" >&2
          exit 1
        fi
        case "$${app_user}" in
          *[!A-Za-z0-9._-]*)
            echo "FRUX_S3_ACCESS_KEY contains unsupported characters" >&2
            exit 1
            ;;
        esac
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${bucket}"
        mc anonymous set none "local/$${bucket}"
        marker="local/$${bucket}/.frux/application-access-key"
        previous_user=
        if mc stat "$${marker}" >/dev/null 2>&1; then
          previous_user=$$(mc cat "$${marker}")
        fi
        cat >/tmp/frux-app-policy.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "s3:GetBucketLocation",
                "s3:ListBucket",
                "s3:ListBucketMultipartUploads"
              ],
              "Resource": ["arn:aws:s3:::$${bucket}"]
            },
            {
              "Effect": "Allow",
              "Action": [
                "s3:GetObject",
                "s3:PutObject",
                "s3:DeleteObject",
                "s3:AbortMultipartUpload",
                "s3:ListMultipartUploadParts"
              ],
              "Resource": [
                "arn:aws:s3:::$${bucket}/uploads/*",
                "arn:aws:s3:::$${bucket}/processed/*",
                "arn:aws:s3:::$${bucket}/moderation/*",
                "arn:aws:s3:::$${bucket}/media/*"
              ]
            }
          ]
        }
        EOF
        mc admin policy create local frux-app /tmp/frux-app-policy.json
        mc admin user add local "$${app_user}" "$${FRUX_S3_SECRET_KEY}"
        mc admin policy attach local frux-app --user "$${app_user}"
        if test -n "$${previous_user}" && test "$${previous_user}" != "$${app_user}"; then
          if mc admin user info local "$${previous_user}" >/dev/null 2>&1; then
            mc admin user remove local "$${previous_user}"
          fi
        fi
        printf '%s' "$${app_user}" | mc pipe "$${marker}" >/dev/null
        recorded_user=$$(mc cat "$${marker}")
        if test "$${recorded_user}" != "$${app_user}"; then
          echo "Frux MinIO application identity rotation could not be verified" >&2
          exit 1
        fi
    networks:
      - backend

  api:
    image: ${FRUX_API_IMAGE:?load .env.release}
    environment: &app-environment
      FRUX_DOMAIN: ${FRUX_DOMAIN:?set FRUX_DOMAIN}
      FRUX_PUBLIC_HTTPS_PORT: ${FRUX_PUBLIC_HTTPS_PORT:?set FRUX_PUBLIC_HTTPS_PORT}
      FRUX_S3_DOMAIN: ${FRUX_S3_DOMAIN:?set FRUX_S3_DOMAIN}
      FRUX_JWT_CONSUMER_SECRET: ${FRUX_JWT_CONSUMER_SECRET:?set FRUX_JWT_CONSUMER_SECRET}
      FRUX_JWT_ADMIN_SECRET: ${FRUX_JWT_ADMIN_SECRET:?set FRUX_JWT_ADMIN_SECRET}
      FRUX_JWT_LEGACY_SECRET: ${FRUX_JWT_LEGACY_SECRET:-}
      FRUX_JWT_LEGACY_ISSUED_UNTIL: ${FRUX_JWT_LEGACY_ISSUED_UNTIL:-}
      FRUX_JWT_LEGACY_ACCEPT_UNTIL: ${FRUX_JWT_LEGACY_ACCEPT_UNTIL:-}
      FRUX_HMAC_SECRET: ${FRUX_HMAC_SECRET:?set FRUX_HMAC_SECRET}
      FRUX_INTERNAL_TOKEN: ${FRUX_INTERNAL_TOKEN:?set FRUX_INTERNAL_TOKEN}
      FRUX_POSTGRES_USER: ${FRUX_POSTGRES_USER:-frux}
      FRUX_POSTGRES_PASSWORD: ${FRUX_POSTGRES_PASSWORD:?set FRUX_POSTGRES_PASSWORD}
      FRUX_POSTGRES_DATABASE: ${FRUX_POSTGRES_DATABASE:-frux}
      FRUX_REDIS_PASSWORD: ${FRUX_REDIS_PASSWORD:?set FRUX_REDIS_PASSWORD}
      FRUX_S3_ACCESS_KEY: ${FRUX_S3_ACCESS_KEY:?set FRUX_S3_ACCESS_KEY}
      FRUX_S3_SECRET_KEY: ${FRUX_S3_SECRET_KEY:?set FRUX_S3_SECRET_KEY}
      FRUX_S3_BUCKET: ${FRUX_S3_BUCKET:?set FRUX_S3_BUCKET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${FRUX_API_PORT:-18081}:8080"
    volumes:
      - ./api/configs/config.prod.yaml:/app/configs/config.yaml:ro
      - api_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      frontend:
        ipv4_address: 172.31.254.4
      backend:

  worker:
    image: ${FRUX_API_IMAGE:?load .env.release}
    command: ["./frux-worker"]
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./api/configs/config.prod.yaml:/app/configs/config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9091/metrics >/dev/null"]
      interval: 15s
      timeout: 3s
      retries: 12
      start_period: 45s
    restart: unless-stopped
    networks:
      - backend

  web:
    image: ${FRUX_WEB_IMAGE:?load .env.release}
    ports:
      - "127.0.0.1:${FRUX_WEB_PORT:-18080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      frontend:
        ipv4_address: 172.31.254.3

  postgres-backup:
    image: postgres:17.5-alpine
    command: ["/opt/frux/postgres-backup.sh"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${FRUX_POSTGRES_USER:-frux}
      POSTGRES_PASSWORD: ${FRUX_POSTGRES_PASSWORD:?set FRUX_POSTGRES_PASSWORD}
      POSTGRES_DB: ${FRUX_POSTGRES_DATABASE:-frux}
      BACKUP_INTERVAL_SECONDS: ${FRUX_BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${FRUX_BACKUP_RETENTION_DAYS:-14}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../scripts/postgres-backup.sh:/opt/frux/postgres-backup.sh:ro
      - postgres_backups:/backups
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -s /backups/.last-success &&
          now=$$(date +%s) &&
          last=$$(cat /backups/.last-success) &&
          test $$((now - last)) -le $$((BACKUP_INTERVAL_SECONDS * 2 + 600))
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 2m
    restart: unless-stopped
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data:
  api_uploads:
  postgres_backups:

networks:
  frontend:
    ipam:
      config:
        - subnet: 172.31.254.0/24
  backend:
