apiVersion: v1
kind: Namespace
metadata:
  name: frux
---
apiVersion: v1
kind: Secret
metadata:
  name: frux-secret
  namespace: frux
type: Opaque
stringData:
  postgres-password: "replace-with-postgres-password"
  jwt-secret: "replace-with-strong-jwt-secret"
  internal-token: "replace-with-strong-internal-token"
  api-config.yaml: |
    port: 8080
    jwt:
      secret: "${FRUX_JWT_SECRET}"
      access_ttl: "15m"
      admin_access_ttl: "30m"
    internal:
      enabled: true
      token: "${FRUX_INTERNAL_TOKEN}"
    database:
      host: "postgres"
      port: 5432
      user: "frux"
      password: "${FRUX_POSTGRES_PASSWORD}"
      name: "frux"
      ssl_mode: "disable"
      time_zone: "UTC"
    redis:
      addr: "redis:6379"
      password: ""
      db: 0
    kafka:
      enabled: true
      environment: "local"
      brokers:
        - "kafka:9092"
      client_id: "frux-kubernetes"
      topic_prefix: ""
      allow_local_provisioning: true
      authentication:
        mechanism: "none"
      tls:
        enabled: false
      timeouts:
        dial: "5s"
        request: "10s"
        produce: "10s"
        admin: "10s"
        shutdown: "15s"
      consumer:
        max_poll_records: 100
        max_poll_bytes: 8388608
        partition_concurrency: 8
        drain_timeout: "10s"
        assignment_timeout: "15s"
      production_validation:
        replication_factor: 1
        min_in_sync_replicas: 1
        require_authentication: false
        require_tls: false
    media:
      backend: "local"
      local_root: "./uploads"
      public_base_url: "/media"
      signed_url_ttl: "15m"
      upload_session_ttl: "15m"
      processing:
        profile_version: "v1"
        max_attempts: 5
        worker_concurrency: 1
        lease_ttl: "10m"
        cleanup_delay: "24h"
    moderation:
      mode: "disabled"
    playback:
      telemetry:
        retention: "168h"
        cleanup_interval: "1h"
        cleanup_batch_size: 1000
        max_batches_per_minute: 60
    governance:
      poll_interval: "5s"
      poll_timeout: "2s"
    rate_limit:
      max_entries: 10000
      idle_ttl: "10m"
      redis_timeout: "75ms"
      trusted_proxies: []
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: frux
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: frux
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
  namespace: frux
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-uploads
  namespace: frux
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: frux
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17.5-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: frux
            - name: POSTGRES_USER
              value: frux
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frux-secret
                  key: postgres-password
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - frux
                - -d
                - frux
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - frux
                - -d
                - frux
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: frux
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: frux
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: frux
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: frux
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: kafka
          image: apache/kafka:4.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: CLUSTER_ID
              value: MkU3OEVBNTcwNTJENDM2Qk
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_LOG_MESSAGE_TIMESTAMP_TYPE
              value: LogAppendTime
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
          ports:
            - name: kafka
              containerPort: 9092
            - name: controller
              containerPort: 9093
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          readinessProbe:
            exec:
              command:
                - /opt/kafka/bin/kafka-broker-api-versions.sh
                - --bootstrap-server
                - 127.0.0.1:9092
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - /opt/kafka/bin/kafka-broker-api-versions.sh
                - --bootstrap-server
                - 127.0.0.1:9092
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
      volumes:
        - name: kafka-data
          persistentVolumeClaim:
            claimName: kafka-data
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: frux
spec:
  selector:
    app: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: frux
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: frux-api:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: FRUX_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frux-secret
                  key: postgres-password
            - name: FRUX_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: frux-secret
                  key: jwt-secret
            - name: FRUX_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: frux-secret
                  key: internal-token
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: api-config
              mountPath: /app/configs/config.yaml
              subPath: api-config.yaml
              readOnly: true
            - name: api-uploads
              mountPath: /app/uploads
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: api-config
          secret:
            secretName: frux-secret
            items:
              - key: api-config.yaml
                path: api-config.yaml
        - name: api-uploads
          persistentVolumeClaim:
            claimName: api-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: frux
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: frux
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: frux-api:latest
          imagePullPolicy: IfNotPresent
          command:
            - ./frux-worker
          env:
            - name: FRUX_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frux-secret
                  key: postgres-password
            - name: FRUX_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: frux-secret
                  key: jwt-secret
            - name: FRUX_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: frux-secret
                  key: internal-token
          ports:
            - name: metrics
              containerPort: 9091
          volumeMounts:
            - name: api-config
              mountPath: /app/configs/config.yaml
              subPath: api-config.yaml
              readOnly: true
            - name: api-uploads
              mountPath: /app/uploads
      volumes:
        - name: api-config
          secret:
            secretName: frux-secret
            items:
              - key: api-config.yaml
                path: api-config.yaml
        - name: api-uploads
          persistentVolumeClaim:
            claimName: api-uploads
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: frux
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: frux-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: frux
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
