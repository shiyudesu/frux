name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "The following Go files are not formatted:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run Go tests
        run: go test ./...

      - name: Build API, Worker, and Multimodal Adapter
        run: go build ./cmd/feed ./cmd/worker ./cmd/multimodal-provider

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install Web dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Web
        run: pnpm run lint

      - name: Run Web tests
        run: pnpm run test

      - name: Build Web
        run: pnpm run build

  repository:
    name: Repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FRUX_INTERNAL_TOKEN: "CI-Only-Internal-Token-123456789!"
      OPENSPEC_TELEMETRY: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Lint GitHub Actions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml

      - name: Validate Docker Compose
        run: docker compose -f apps/docker-compose.yml config --quiet

      - name: Validate Prod Compose
        env:
          FRUX_DOMAIN: frux.example.com
          FRUX_PUBLIC_HTTPS_PORT: "18443"
          FRUX_S3_DOMAIN: s3.frux.example.com
          FRUX_JWT_CONSUMER_SECRET: CI-Only-Consumer-JWT-Secret-123!
          FRUX_JWT_ADMIN_SECRET: CI-Only-Admin-JWT-Secret-123456!
          FRUX_HMAC_SECRET: CI-Only-Application-HMAC-Secret-123!
          FRUX_INTERNAL_TOKEN: CI-Only-Internal-Token-123456!
          FRUX_POSTGRES_PASSWORD: CI-Only-Postgres-Password-123!
          FRUX_REDIS_PASSWORD: CI-Only-Redis-Password-123!
          FRUX_MINIO_ROOT_USER: ci-root
          FRUX_MINIO_ROOT_PASSWORD: CI-Only-MinIO-Root-Password-123!
          FRUX_S3_ACCESS_KEY: ci-access
          FRUX_S3_SECRET_KEY: CI-Only-MinIO-App-Secret
          FRUX_S3_BUCKET: ci-bucket
        run: |
          services=$(
            docker compose \
              --env-file apps/.env.release.example \
              -f apps/docker-compose.prod.yml \
              config --services
          )
          for service in worker minio minio-init; do
            grep -qx "$service" <<<"$services"
          done
          profiles=$(
            docker compose \
              --env-file apps/.env.release.example \
              -f apps/docker-compose.prod.yml \
              config --profiles
          )
          grep -qx multimodal <<<"$profiles"
          for service in worker minio minio-init; do
            if grep -qx "$service" <<<"$profiles"; then
              echo "Required Prod service must not use an optional Compose profile: $service"
              exit 1
            fi
          done
          docker compose \
            --env-file apps/.env.release.example \
            -f apps/docker-compose.prod.yml \
            config --quiet
          docker compose \
            --env-file apps/.env.release.example \
            -f apps/docker-compose.prod.yml \
            config --format json >"$RUNNER_TEMP/frux-prod-compose.json"
          python3 - "$RUNNER_TEMP/frux-prod-compose.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              services = json.load(handle)["services"]

          for name in ("postgres", "redis", "kafka", "worker", "minio-init"):
              assert not services[name].get("ports"), f"{name} must not publish host ports"

          for name in ("api", "web", "minio"):
              ports = services[name].get("ports", [])
              assert ports, f"{name} must publish loopback ports"
              assert all(port.get("host_ip") == "127.0.0.1" for port in ports), (
                  f"{name} ports must bind to loopback"
              )

          for name in ("api", "worker"):
              dependency = services[name]["depends_on"]["minio-init"]
              assert dependency["condition"] == "service_completed_successfully", (
                  f"{name} must wait for successful MinIO initialization"
              )

          with open("scripts/prod-deploy.sh", encoding="utf-8") as handle:
              deploy_script = handle.read()
          assert 'wait_healthy "$release" minio' in deploy_script, (
              "Prod deployment readiness must include MinIO"
          )
          assert 'wait_healthy "$release" multimodal-provider' in deploy_script, (
              "Multimodal deployment readiness must include Adapter"
          )
          assert '.deployed-config-digest' in deploy_script, (
              "Prod deployment must re-apply same-image environment changes"
          )
          PY

          FRUX_PUBLIC_ACCESS_MODE=direct-http \
          FRUX_PUBLIC_SCHEME=http \
          FRUX_DOMAIN=203.0.113.10 \
          FRUX_S3_DOMAIN=203.0.113.10 \
          FRUX_PUBLIC_HTTPS_PORT='' \
          FRUX_PUBLIC_APP_PORT=18082 \
          FRUX_WEB_PORT=18082 \
          FRUX_PUBLIC_S3_PORT=19000 \
          FRUX_PUBLIC_BIND_ADDRESS=0.0.0.0 \
          FRUX_S3_REQUIRE_PUBLIC_HTTPS=false \
          docker compose \
            --env-file apps/.env.release.example \
            -f apps/docker-compose.prod.yml \
            config --format json >"$RUNNER_TEMP/frux-prod-direct-compose.json"
          python3 - "$RUNNER_TEMP/frux-prod-direct-compose.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              services = json.load(handle)["services"]

          assert all(
              port.get("host_ip") == "127.0.0.1"
              for port in services["api"].get("ports", [])
          ), "direct-IP mode must keep API loopback-only"

          web_ports = services["web"].get("ports", [])
          assert len(web_ports) == 1
          assert web_ports[0].get("host_ip") == "0.0.0.0"
          assert int(web_ports[0]["published"]) == 18082

          minio_ports = services["minio"].get("ports", [])
          minio_api = next(port for port in minio_ports if int(port["target"]) == 9000)
          minio_console = next(port for port in minio_ports if int(port["target"]) == 9001)
          assert minio_api.get("host_ip") == "0.0.0.0"
          assert int(minio_api["published"]) == 19000
          assert minio_console.get("host_ip") == "127.0.0.1"

          api_environment = services["api"]["environment"]
          assert api_environment["FRUX_PUBLIC_SCHEME"] == "http"
          assert str(api_environment["FRUX_PUBLIC_APP_PORT"]) == "18082"
          assert str(api_environment["FRUX_PUBLIC_S3_PORT"]) == "19000"
          assert str(api_environment["FRUX_S3_REQUIRE_PUBLIC_HTTPS"]).lower() == "false"
          PY

          FRUX_MULTIMODAL_DEPLOYMENT_ENABLED=true \
          FRUX_MULTIMODAL_PROFILE=tongyi-embedding-vision-flash-2026-03-06 \
          FRUX_MULTIMODAL_ENDPOINT=http://multimodal-provider:8099 \
          FRUX_MULTIMODAL_HMAC_SECRET=CI-Only-Multimodal-HMAC-Secret-123! \
          FRUX_MULTIMODAL_ENABLED=true \
          FRUX_MULTIMODAL_VIDEO_JOBS_ENABLED=true \
          FRUX_MULTIMODAL_QUERY_EMBEDDING_ENABLED=true \
          FRUX_MULTIMODAL_HYBRID_SEARCH_ENABLED=true \
          FRUX_MULTIMODAL_HYBRID_MIN_SIMILARITY=0.55 \
          FRUX_MULTIMODAL_HYBRID_MAX_SEMANTIC_ONLY=5 \
          FRUX_MULTIMODAL_SESSION_RECOMMENDATION_ENABLED=true \
          FRUX_MULTIMODAL_SESSION_DEVELOPMENT_FULL_ROLLOUT_ENABLED=false \
          FRUX_MULTIMODAL_SESSION_PRODUCTION_FULL_ROLLOUT_ENABLED=true \
          FRUX_MULTIMODAL_ALLOW_INSECURE_PRIVATE_NETWORK=true \
          DASHSCOPE_API_KEY=ci-dashscope-key \
          docker compose \
            --profile multimodal \
            --env-file apps/.env.release.example \
            -f apps/docker-compose.prod.yml \
            config --format json >"$RUNNER_TEMP/frux-prod-multimodal-compose.json"
          python3 - "$RUNNER_TEMP/frux-prod-multimodal-compose.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              services = json.load(handle)["services"]

          adapter = services["multimodal-provider"]
          assert not adapter.get("ports"), "Adapter must not publish a host port"
          assert set(adapter["networks"]) == {"backend"}, "Adapter must be backend-only"
          assert adapter.get("healthcheck", {}).get("test"), "Adapter must have a healthcheck"
          assert adapter.get("profiles") == ["multimodal"]

          api_environment = services["api"]["environment"]
          worker_environment = services["worker"]["environment"]
          adapter_environment = adapter["environment"]
          for environment in (api_environment, worker_environment):
              assert "DASHSCOPE_API_KEY" not in environment
          assert adapter_environment["DASHSCOPE_API_KEY"] == "ci-dashscope-key"
          assert api_environment["FRUX_MULTIMODAL_ENDPOINT"] == "http://multimodal-provider:8099"
          assert api_environment["FRUX_MULTIMODAL_HMAC_SECRET"] == "CI-Only-Multimodal-HMAC-Secret-123!"
          assert str(api_environment["FRUX_MULTIMODAL_QUERY_EMBEDDING_ENABLED"]).lower() == "true"
          assert str(api_environment["FRUX_MULTIMODAL_HYBRID_SEARCH_ENABLED"]).lower() == "true"
          assert str(api_environment["FRUX_MULTIMODAL_HYBRID_MIN_SIMILARITY"]) == "0.55"
          assert str(api_environment["FRUX_MULTIMODAL_HYBRID_MAX_SEMANTIC_ONLY"]) == "5"
          assert str(api_environment["FRUX_MULTIMODAL_ALLOW_INSECURE_PRIVATE_NETWORK"]).lower() == "true"
          assert "FRUX_MULTIMODAL_VIDEO_JOBS_ENABLED" not in api_environment
          assert worker_environment["FRUX_MULTIMODAL_ENDPOINT"] == "http://multimodal-provider:8099"
          assert worker_environment["FRUX_MULTIMODAL_HMAC_SECRET"] == "CI-Only-Multimodal-HMAC-Secret-123!"
          assert str(worker_environment["FRUX_MULTIMODAL_VIDEO_JOBS_ENABLED"]).lower() == "true"
          assert str(worker_environment["FRUX_MULTIMODAL_ALLOW_INSECURE_PRIVATE_NETWORK"]).lower() == "true"
          assert str(api_environment["FRUX_MULTIMODAL_SESSION_PRODUCTION_FULL_ROLLOUT_ENABLED"]).lower() == "true"
          dependency = services["worker"]["depends_on"]["multimodal-provider"]
          assert dependency["condition"] == "service_healthy"
          assert dependency["required"] is False
          PY

          FRUX_PUBLIC_ACCESS_MODE=direct-http \
          FRUX_PUBLIC_SCHEME=http \
          FRUX_DOMAIN=203.0.113.10 \
          FRUX_S3_DOMAIN=203.0.113.10 \
          FRUX_PUBLIC_HTTPS_PORT='' \
          FRUX_PUBLIC_APP_PORT=18082 \
          FRUX_WEB_PORT=18082 \
          FRUX_PUBLIC_S3_PORT=19000 \
          FRUX_PUBLIC_BIND_ADDRESS=0.0.0.0 \
          FRUX_S3_REQUIRE_PUBLIC_HTTPS=false \
          FRUX_MULTIMODAL_DEPLOYMENT_ENABLED=true \
          FRUX_MULTIMODAL_PROFILE=tongyi-embedding-vision-flash \
          FRUX_MULTIMODAL_ENDPOINT=http://multimodal-provider:8099 \
          FRUX_MULTIMODAL_HMAC_SECRET=CI-Only-Multimodal-HMAC-Secret-123! \
          FRUX_MULTIMODAL_ENABLED=true \
          FRUX_MULTIMODAL_VIDEO_JOBS_ENABLED=true \
          FRUX_MULTIMODAL_QUERY_EMBEDDING_ENABLED=true \
          FRUX_MULTIMODAL_HYBRID_SEARCH_ENABLED=true \
          FRUX_MULTIMODAL_HYBRID_MIN_SIMILARITY=0.55 \
          FRUX_MULTIMODAL_HYBRID_MAX_SEMANTIC_ONLY=5 \
          FRUX_MULTIMODAL_SESSION_RECOMMENDATION_ENABLED=true \
          FRUX_MULTIMODAL_SESSION_DEVELOPMENT_FULL_ROLLOUT_ENABLED=false \
          FRUX_MULTIMODAL_SESSION_PRODUCTION_FULL_ROLLOUT_ENABLED=true \
          FRUX_MULTIMODAL_ALLOW_INSECURE_PRIVATE_NETWORK=true \
          DASHSCOPE_API_KEY=ci-dashscope-key \
          docker compose \
            --profile multimodal \
            --env-file apps/.env.release.example \
            -f apps/docker-compose.prod.yml \
            config --format json >"$RUNNER_TEMP/frux-prod-direct-multimodal-compose.json"
          python3 - "$RUNNER_TEMP/frux-prod-direct-multimodal-compose.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              services = json.load(handle)["services"]

          assert not services["multimodal-provider"].get("ports")
          assert all(
              port.get("host_ip") == "127.0.0.1"
              for port in services["api"].get("ports", [])
          )
          assert services["web"]["ports"][0].get("host_ip") == "0.0.0.0"
          minio_api = next(
              port for port in services["minio"]["ports"] if int(port["target"]) == 9000
          )
          assert minio_api.get("host_ip") == "0.0.0.0"
          PY
          bash scripts/prod-deploy_test.sh
          bash scripts/validate-prod-minio.sh

      - name: Validate OpenSpec
        run: pnpm dlx @fission-ai/openspec@1.6.0 validate --all --strict
