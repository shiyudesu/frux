name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "The following Go files are not formatted:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run Go tests
        run: go test ./...

      - name: Build API and Worker
        run: go build ./cmd/feed ./cmd/worker

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install Web dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Web
        run: pnpm run lint

      - name: Run Web tests
        run: pnpm run test

      - name: Build Web
        run: pnpm run build

  repository:
    name: Repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FRUX_INTERNAL_TOKEN: "CI-Only-Internal-Token-123456789!"
      OPENSPEC_TELEMETRY: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Lint GitHub Actions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml

      - name: Validate Docker Compose
        run: docker compose -f apps/docker-compose.yml config --quiet

      - name: Validate Prod Compose
        env:
          FRUX_DOMAIN: frux.example.com
          FRUX_JWT_CONSUMER_SECRET: CI-Only-Consumer-JWT-Secret-123!
          FRUX_JWT_ADMIN_SECRET: CI-Only-Admin-JWT-Secret-123456!
          FRUX_HMAC_SECRET: CI-Only-Application-HMAC-Secret-123!
          FRUX_INTERNAL_TOKEN: CI-Only-Internal-Token-123456!
          FRUX_POSTGRES_PASSWORD: CI-Only-Postgres-Password-123!
          FRUX_REDIS_PASSWORD: CI-Only-Redis-Password-123!
          FRUX_S3_ACCESS_KEY: ci-access
          FRUX_S3_SECRET_KEY: CI-Only-Rainyun-Secret
        run: |
          services=$(
            docker compose \
              --env-file apps/.env.release.example \
              -f apps/docker-compose.prod.yml \
              config --services
          )
          grep -qx worker <<<"$services"
          docker compose \
            --env-file apps/.env.release.example \
            -f apps/docker-compose.prod.yml \
            config --quiet

      - name: Validate OpenSpec
        run: pnpm dlx @fission-ai/openspec@1.6.0 validate --all --strict
