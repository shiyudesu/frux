name: 功能建议
description: 提议新功能或现有行为改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - API
        - Worker
        - Web
        - 推荐 / Feed
        - Docker / 部署
        - 对象存储 / 媒体处理
        - 文档
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 现在有什么问题
      description: 描述实际使用中的问题，不要只写解决方案。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 希望怎么改
      description: 描述期望行为、使用方式或接口变化。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 如果考虑过替代方案，可以写在这里。

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可附原型、截图、接口示例或相关资料，请勿包含敏感信息。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 Issue，没有发现相同建议。
          required: true
