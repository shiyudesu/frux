services:
  rabbitmq-init:
    image: rabbitmq:3.13-management-alpine
    user: "0"
    environment:
      RABBITMQ_ERLANG_COOKIE: ${FRUX_RABBITMQ_ERLANG_COOKIE:?set rollback Erlang cookie}
      RABBITMQ_DEFAULT_USER: ${FRUX_RABBITMQ_USER:?set rollback broker user}
      RABBITMQ_DEFAULT_PASS: ${FRUX_RABBITMQ_PASSWORD:?set rollback broker password}
    command:
      - sh
      - -c
      - >-
        printf '%s' "$$RABBITMQ_DEFAULT_USER" | grep -Eq '^[A-Za-z0-9._~-]+$$' &&
        printf '%s' "$$RABBITMQ_DEFAULT_PASS" | grep -Eq '^[A-Za-z0-9._~-]+$$' &&
        printf '%s' "$$RABBITMQ_ERLANG_COOKIE" > /var/lib/rabbitmq/.erlang.cookie &&
        chown -R 100:101 /var/lib/rabbitmq &&
        chmod 600 /var/lib/rabbitmq/.erlang.cookie
    volumes:
      - rabbitmq_rollback_data:/var/lib/rabbitmq

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    depends_on:
      rabbitmq-init:
        condition: service_completed_successfully
    environment:
      RABBITMQ_DEFAULT_USER: ${FRUX_RABBITMQ_USER:?set rollback broker user}
      RABBITMQ_DEFAULT_PASS: ${FRUX_RABBITMQ_PASSWORD:?set rollback broker password}
      RABBITMQ_ERLANG_COOKIE: ${FRUX_RABBITMQ_ERLANG_COOKIE:?set rollback Erlang cookie}
    volumes:
      - rabbitmq_rollback_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 30s
      retries: 20

  api:
    image: ${FRUX_PREVIOUS_API_IMAGE:?set previous API image}
    environment:
      FRUX_INTERNAL_TOKEN: ${FRUX_INTERNAL_TOKEN:?set internal token}
      FRUX_JWT_SECRET: ${FRUX_JWT_SECRET:?set JWT secret}
      FRUX_RABBITMQ_USER: ${FRUX_RABBITMQ_USER:?set rollback broker user}
      FRUX_RABBITMQ_PASSWORD: ${FRUX_RABBITMQ_PASSWORD:?set rollback broker password}
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ${FRUX_PREVIOUS_CONFIG:-./config.rabbitmq.yaml}:/app/configs/config.yaml:ro
    networks:
      - default
      - dependencies

  worker:
    image: ${FRUX_PREVIOUS_API_IMAGE:?set previous API image}
    command: ["./frux-worker"]
    environment:
      FRUX_INTERNAL_TOKEN: ${FRUX_INTERNAL_TOKEN:?set internal token}
      FRUX_JWT_SECRET: ${FRUX_JWT_SECRET:?set JWT secret}
      FRUX_RABBITMQ_USER: ${FRUX_RABBITMQ_USER:?set rollback broker user}
      FRUX_RABBITMQ_PASSWORD: ${FRUX_RABBITMQ_PASSWORD:?set rollback broker password}
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ${FRUX_PREVIOUS_CONFIG:-./config.rabbitmq.yaml}:/app/configs/config.yaml:ro
    networks:
      - default
      - dependencies

volumes:
  rabbitmq_rollback_data:

networks:
  dependencies:
    name: ${FRUX_ROLLBACK_DEPENDENCY_NETWORK:-apps_default}
    external: true
